{% extends "main.html" %}
{% block container %}
  <div class="md-content" data-md-component="content">
    <div class="md-content__inner">
      <header class="md-typeset blog-header">
        {{ page.content }}
      </header>
      <div class="post-grid">
        {% for post in posts %}
          {% include "partials/post.html" %}
        {% endfor %}
      </div>
      {% if pagination %}
        {% block pagination %}
          {% include "partials/pagination.html" %}
        {% endblock %}
      {% endif %}
    </div>
  </div>
{% endblock %}
