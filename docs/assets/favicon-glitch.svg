<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Glitched circle favicon">
  <rect width="64" height="64" rx="12" fill="#10120d"/>

  <!-- Displaced red signal behind the main mark -->
  <circle cx="35" cy="32" r="20" fill="none" stroke="#c7202d" stroke-width="9"
          stroke-dasharray="25 12 47 14 20 8" transform="rotate(-20 35 32)"/>

  <!-- Heavy fragmented ring, optimized for favicon scale -->
  <circle cx="30" cy="32" r="20" fill="none" stroke="#afb486" stroke-width="10"
          stroke-dasharray="45 11 24 10 28 8" transform="rotate(-20 30 32)"/>

  <!-- Hard horizontal corruption cuts -->
  <rect x="4" y="25" width="24" height="5" fill="#10120d"/>
  <rect x="35" y="37" width="25" height="5" fill="#10120d"/>

  <!-- Shifted fragments make the glitch visible at 16px -->
  <rect x="5" y="24" width="17" height="5" fill="#c7202d"/>
  <rect x="42" y="38" width="17" height="5" fill="#c7202d"/>
  <rect x="10" y="31" width="12" height="5" fill="#777b55"/>
  <rect x="39" y="29" width="15" height="5" fill="#cec39a"/>

  <!-- Restore a clean, unmistakable circular void -->
  <circle cx="30" cy="32" r="11" fill="#070806"/>
</svg>
