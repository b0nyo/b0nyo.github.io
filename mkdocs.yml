site_name: b0nyo // Offensive Security
site_description: Personal cyber security research, CTF write-ups, and vulnerability disclosures by Jose Raul Bongiovani.
site_author: Jose Raul Bongiovani
site_url: https://b0nyo.github.io/
theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    scheme: slate
    primary: black
    accent: custom
nav:
  - Home: index.md
  - Write-ups: /#write-ups
  - CVEs: /#cve-disclosures
  - About & Contact: /#about-contact
plugins:
  - search
  - tags
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/site.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/b0nyo
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/jose-raul-bongiovani/
      name: LinkedIn
    - icon: fontawesome/solid/cube
      link: https://app.hackthebox.com/users/1117173
      name: Hack The Box
copyright: Copyright &copy; 2026 Jose Raul Bongiovani
